
[channels.cli]
template = "agent"

# Telegram(token 支持 <ENV_NAME> 占位符)
[channels.telegram]
enabled = true
template = "telegram"
token = "<TELEGRAM_BOT_TOKEN>"
max_send_attempts = 3

[engine]
max_iterations = 100

[storage]
dir = "./data"

[permissions]
# Owner allowlist: `(channel, user id)` entries that get full permissions.
# owner = ["telegram:123456"]

[system_prompt]
character_path = "./characters/default.md"
