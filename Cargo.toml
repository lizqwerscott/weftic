[package]
name = "weftic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
colored = "3.1.1"
deadpool-sqlite = "0.14.0"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"]}
futures = "0.3.34"
genai = "0.6.5"
grep = "0.4.1"
ignore = "0.4.33"
minijinja = "2.24.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "time", "signal", "macros", "rt-multi-thread"]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }
